[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.150.0"     # pin a current Extended version
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"

# Deploy previews build against their own URL, and are excluded from indexing.
[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"
